<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Posts và Comments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }

        .container-main {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .page-header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .page-header p {
            color: #666;
            margin: 0;
        }

        .card-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .section-title {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-control, .form-select {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 15px;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            color: white;
            text-decoration: none;
        }

        .btn-sm-custom {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-edit {
            background: #3498db;
            color: white;
        }

        .btn-edit:hover {
            background: #2980b9;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .btn-restore {
            background: #27ae60;
            color: white;
        }

        .btn-restore:hover {
            background: #229954;
        }

        .btn-comment {
            background: #9b59b6;
            color: white;
        }

        .btn-comment:hover {
            background: #8e44ad;
        }

        table {
            margin-bottom: 0;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        tbody tr {
            transition: all 0.3s;
        }

        tbody tr:hover {
            background-color: #f0f0f0;
        }

        .post-deleted {
            text-decoration: line-through;
            color: #999;
            opacity: 0.7;
        }

        .badge-deleted {
            background: #e74c3c;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .no-data i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .comment-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .comment-id {
            font-weight: 700;
            color: #667eea;
        }

        .comment-text {
            color: #333;
            margin-bottom: 10px;
        }

        .comment-postId {
            color: #999;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .comment-actions {
            display: flex;
            gap: 8px;
        }

        .tabs-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 20px;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            position: relative;
            bottom: -2px;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .row-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .row-form {
                grid-template-columns: 1fr;
            }

            .tabs-nav {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container-main">
        <!-- Header -->
        <div class="page-header">
            <h1><i class="fas fa-database"></i> Quản lý Posts & Comments</h1>
            <p>Hệ thống quản lý bài viết và bình luận với xóa mềm</p>
        </div>

        <!-- Tabs Navigation -->
        <div class="card-section">
            <div class="tabs-nav">
                <button class="tab-btn active" onclick="switchTab('posts')">
                    <i class="fas fa-file-alt"></i> Quản lý Posts
                </button>
                <button class="tab-btn" onclick="switchTab('comments')">
                    <i class="fas fa-comments"></i> Quản lý Comments
                </button>
            </div>
        </div>

        <!-- Posts Tab -->
        <div id="posts-tab" class="tab-content active">
            <!-- Form tạo/sửa Post -->
            <div class="card-section">
                <h3 class="section-title">
                    <i class="fas fa-plus-circle"></i>
                    <span id="form-title">Tạo bài viết mới</span>
                </h3>

                <form id="postForm">
                    <div class="row-form">
                        <div>
                            <label class="form-label">Tiêu đề</label>
                            <input type="text" class="form-control" id="postTitle" placeholder="Nhập tiêu đề..." required>
                        </div>
                        <div>
                            <label class="form-label">Lượt xem</label>
                            <input type="number" class="form-control" id="postViews" placeholder="Nhập số lượt xem..." value="0" required>
                        </div>
                    </div>

                    <div style="margin-top: 20px; display: flex; gap: 10px;">
                        <button type="submit" class="btn-primary-custom">
                            <i class="fas fa-save"></i> Lưu
                        </button>
                        <button type="reset" class="btn btn-secondary" onclick="resetForm()">
                            <i class="fas fa-redo"></i> Hủy
                        </button>
                    </div>
                </form>
            </div>

            <!-- Danh sách Posts -->
            <div class="card-section">
                <h3 class="section-title">
                    <i class="fas fa-list"></i> Danh sách Posts
                </h3>

                <div id="posts-container">
                    <div class="no-data">
                        <i class="fas fa-inbox"></i>
                        <p>Chưa có bài viết nào</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Comments Tab -->
        <div id="comments-tab" class="tab-content">
            <!-- Form tạo/sửa Comment -->
            <div class="card-section">
                <h3 class="section-title">
                    <i class="fas fa-comment-plus"></i>
                    <span id="comment-form-title">Tạo bình luận mới</span>
                </h3>

                <form id="commentForm">
                    <div>
                        <label class="form-label">Chọn bài viết</label>
                        <select class="form-select" id="commentPostId" required>
                            <option value="">-- Chọn bài viết --</option>
                        </select>
                    </div>

                    <div style="margin-top: 20px;">
                        <label class="form-label">Nội dung bình luận</label>
                        <textarea class="form-control" id="commentText" placeholder="Nhập nội dung bình luận..." rows="4" required></textarea>
                    </div>

                    <div style="margin-top: 20px; display: flex; gap: 10px;">
                        <button type="submit" class="btn-primary-custom">
                            <i class="fas fa-save"></i> Lưu
                        </button>
                        <button type="reset" class="btn btn-secondary" onclick="resetCommentForm()">
                            <i class="fas fa-redo"></i> Hủy
                        </button>
                    </div>
                </form>
            </div>

            <!-- Danh sách Comments -->
            <div class="card-section">
                <h3 class="section-title">
                    <i class="fas fa-comments"></i> Danh sách Comments
                </h3>

                <div id="comments-container">
                    <div class="no-data">
                        <i class="fas fa-inbox"></i>
                        <p>Chưa có bình luận nào</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
